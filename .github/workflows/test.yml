name: test

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Run tests (Neovim ${{ matrix.nvim }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nvim: ["v0.10.4", "v0.11.4", "nightly"]
    steps:
      - uses: actions/checkout@v4

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim }}

      - name: Clone plenary.nvim
        run: |
          mkdir -p tests/.deps
          git clone --depth 1 https://github.com/nvim-lua/plenary.nvim tests/.deps/plenary.nvim

      - name: Run tests
        run: ./scripts/test.sh

  style:
    name: Check formatting (stylua)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          version: latest
          args: --check lua/ tests/
