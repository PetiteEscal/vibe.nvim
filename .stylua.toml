# StyLua configuration — matches the existing indentation style of the
# vibe.nvim Lua sources (2 spaces, double quotes, LF). Pinned so that the
# `stylua --check` CI job and local `scripts/test.sh` agree.
column_width = 120
indent_type = "Spaces"
indent_width = 2
line_endings = "Unix"
quote_style = "AutoPreferDouble"
